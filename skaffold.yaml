apiVersion: skaffold/v2beta26
kind: Config
deploy:
  kubectl:
    manifests:
      - infra/k8s/*
build:
  tagPolicy:
    envTemplate:
      template: "{{.IMAGE_TAG}}"
  local:
    push: false
  artifacts:
    - image: sushantskb/big-tickets
      context: auth
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: "src/**/*.ts"
            dest: .
