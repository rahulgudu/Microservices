apiVersion: apps/v1
kind: Deployment
metadata: 
  name: query-depl
spec: 
  replicas: 1
  selector:
    matchLabels: 
      app: query
  template:
    metadata:
      labels:
        app: query 
    spec:
      containers:
        - name: query
          image: sushantskb/microservices:query-latest # generally here it should be microservices:latest but since I am maintaining multiple versions of the same microservice, I have used a different tag for each version....
---
apiVersion: v1
kind: Service
metadata:
  name: query-srv
spec:
  selector:
    app: query
  type: ClusterIP
  ports: 
    - name: query
      protocol: TCP
      port: 9000
      targetPort: 9000