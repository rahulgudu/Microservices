apiVersion: apps/v1
kind: Deployment
metadata: 
  name: moderation-depl
spec: 
  replicas: 1
  selector:
    matchLabels: 
      app: moderation
  template:
    metadata:
      labels:
        app: moderation 
    spec:
      containers:
        - name: moderation
          image: sushantskb/microservices:moderation-latest # generally here it should be microservices:latest but since I am maintaining multiple versions of the same microservice, I have used a different tag for each version....
          imagePullPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: moderation-srv
spec:
  selector:
    app: moderation
  type: ClusterIP
  ports: 
    - name: moderation
      protocol: TCP
      port: 8000
      targetPort: 8000