apiVersion: apps/v1
kind: Deployment
metadata: 
  name: comments-depl
spec: 
  replicas: 1
  selector:
    matchLabels: 
      app: comments
  template:
    metadata:
      labels:
        app: comments 
    spec:
      containers:
        - name: comments
          image: sushantskb/microservices:comments-latest # generally here it should be microservices:latest but since I am maintaining multiple versions of the same microservice, I have used a different tag for each version....
          imagePullPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: comments-srv
spec:
  selector:
    app: comments
  type: ClusterIP
  ports: 
    - name: comments
      protocol: TCP
      port: 5000
      targetPort: 5000